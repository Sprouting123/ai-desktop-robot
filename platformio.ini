[platformio]
; GPIO48 is supported by the original RGB script read directly from this board.
default_envs = rgb_gpio48
core_dir = .pio-core

[env]
platform = platformio/espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
; The generic board defaults to N8. Override for the reported N16R8 module.
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
; Adds a 4 MB `model` partition for ESP-SR at 0x410000. The model image is
; written separately; see experiments/016-wake-probe/README.md.
board_build.partitions = partitions_16mb_wake.csv
; Read-only voice asset linked into flash as _binary_*_start/_end symbols.
board_build.embed_files = assets/audio/hello_zh.raw
upload_protocol = esptool
upload_speed = 115200
; Exact COM bridge identity, avoiding the camera on ttyACM0.
upload_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_5D4D001473-if00
monitor_port = ${env.upload_port}
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
; Echo typed characters locally; send a complete command when Enter is pressed.
monitor_echo = yes
monitor_eol = LF
monitor_filters =
    time
    send_on_enter
build_flags =
    -DBOARD_HAS_PSRAM
    ; COM connector uses UART0, not the native USB CDC console.
    -DARDUINO_USB_CDC_ON_BOOT=0
    ; Experiment 016 Route A: link the ESP-SR 1.9.2 prebuilt libraries into the
    ; Arduino firmware. The C sources needed by the Arduino build live in
    ; src/esp_sr/. Components are not committed; see the probe README.
    -DCONFIG_USE_AFE=1
    -DCONFIG_AFE_INTERFACE_V1=1
    -DCONFIG_USE_WAKENET=1
    -DCONFIG_MODEL_IN_FLASH=1
    -I${PROJECT_DIR}/experiments/016-wake-probe/components/esp-sr/include/esp32s3
    -I${PROJECT_DIR}/experiments/016-wake-probe/components/esp-sr/src/include
    -I${PROJECT_DIR}/experiments/016-wake-probe/components/esp-sr/esp-tts/esp_tts_chinese/include
    -L${PROJECT_DIR}/experiments/016-wake-probe/components/esp-sr/lib/esp32s3
    -L${PROJECT_DIR}/experiments/016-wake-probe/components/esp-sr/esp-tts/esp_tts_chinese/esp32s3
    -Wl,--start-group
    -lc_speech_features
    -ldl_lib
    -lesp_audio_front_end
    -lesp_audio_processor
    -lflite_g2p
    -lfst
    -lhufzip
    -lmultinet
    -lnsnet
    -lwakenet
    -lesp_tts_chinese
    -lvoice_set_xiaole
    -Wl,--end-group
lib_deps =
    adafruit/Adafruit NeoPixel@1.15.5
    olikraus/U8g2@2.36.17

[env:diagnostics]
build_flags =
    ${env.build_flags}
    -DRGB_LED_PIN=-1

; Selected from onboard script evidence; exact PCB revision remains unknown.
[env:rgb_gpio48]
build_flags =
    ${env.build_flags}
    -DRGB_LED_PIN=48

; Alternative for boards wired to GPIO38; not flashed to this board.
[env:rgb_gpio38]
build_flags =
    ${env.build_flags}
    -DRGB_LED_PIN=38
