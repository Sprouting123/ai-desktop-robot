; 实验 016 第一阶段：独立唤醒词探针
; 不参与主工程构建，仅用于验证 ESP-SR 1.9.2 + ESP-IDF 4.4.7 的可行性。
[env:wake_probe]
platform = espressif32@6.12.0
framework = espidf
board = esp32-s3-devkitc-1
platform_packages = platformio/framework-espidf@~3.40407.0
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
build_flags =
    -DBOARD_HAS_PSRAM
